[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "0.1.0"
description = "NetGuard AI: A Machine Learning Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.43.0",
    "joblib>=1.3.0",
    "streamlit>=1.28.0",
    "optuna>=3.4.0",
    "scapy>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
netguard = "netguard.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["netguard*"]
